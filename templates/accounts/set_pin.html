{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-header"><i class="bi bi-123 me-2"></i>{% trans "POS PIN Kodu" %}</div>
      <div class="card-body">
        <p class="text-muted small">
          {% trans "PIN kodu; POS terminalinde hızlı kullanıcı değişimi ve iptal/indirim gibi işlemlerde yetkili onayı için kullanılır. 4-8 haneli olmalıdır ve şifrelenerek saklanır." %}
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">{% trans "Yeni PIN" %}</label>
            <input type="password" name="pin" class="form-control form-control-lg text-center"
                   inputmode="numeric" maxlength="8" pattern="[0-9]{4,8}" required autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label">{% trans "PIN (tekrar)" %}</label>
            <input type="password" name="pin_confirm" class="form-control form-control-lg text-center"
                   inputmode="numeric" maxlength="8" pattern="[0-9]{4,8}" required autocomplete="new-password">
          </div>
          <button class="btn btn-primary w-100 btn-touch">{% trans "PIN'i kaydet" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
