{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-xl-9">
    <div class="card">
      <div class="card-header">{{ page_title }}</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include "includes/_form_fields.html" %}
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary"><i class="bi bi-save me-1"></i>{% trans "Kaydet" %}</button>
            <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">{% trans "Vazgeç" %}</a>
            {% if user_obj %}
              <a href="{% url 'accounts:user_permissions' user_obj.pk %}" class="btn btn-outline-secondary ms-auto">
                <i class="bi bi-key me-1"></i>{% trans "İzinleri düzenle" %}</a>
            {% endif %}
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
